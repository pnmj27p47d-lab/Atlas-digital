
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0c0f;color:white;font-family:Arial;padding:20px}
header{display:flex;align-items:center;gap:12px;margin-bottom:25px}
.logo{background:#d6b46a;color:#111;padding:13px 17px;border-radius:14px;font-size:25px;font-weight:bold}
h1{margin:0;color:#d6b46a}
small{color:#aaa}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#1a1a20;border:1px solid #333;border-radius:15px;padding:17px}
.card small{display:block}
.number{font-size:24px;margin-top:12px;font-weight:bold}
section{background:#1a1a20;border:1px solid #333;border-radius:15px;padding:17px;margin-top:17px}
h2{font-size:18px;color:#d6b46a;margin-top:0}
input,button{width:100%;padding:13px;border-radius:10px;margin:6px 0;border:1px solid #444;font-size:15px}
input{background:#101014;color:white}
button{background:#d6b46a;color:#111;font-weight:bold;border:0}
.secondary{background:#303039;color:white}
li{padding:8px;border-bottom:1px solid #333}
</style>
</head>
<body>
<header>
<div class="logo">A</div>
<div><h1>ATLAS AI</h1><small>Dijital İş Yönetim Merkezi</small></div>
</header>

<div class="cards">
<div class="card"><small>Toplam Ciro</small><div class="number" id="sales">0 TL</div></div>
<div class="card"><small>Toplam Gider</small><div class="number" id="expenses">0 TL</div></div>
<div class="card"><small>Net Kâr</small><div class="number" id="profit">0 TL</div></div>
<div class="card"><small>Satış Sayısı</small><div class="number" id="count">0</div></div>
</div>

<section>
<h2>Satış Ekle</h2>
<input id="sale" type="number" placeholder="Satış tutarı (TL)">
<button onclick="add('sale')">Satışı Kaydet</button>
</section>

<section>
<h2>Gider Ekle</h2>
<input id="expense" type="number" placeholder="Gider tutarı (TL)">
<button onclick="add('expense')">Gideri Kaydet</button>
</section>

<section>
<h2>Görev Yönetimi</h2>
<input id="task" placeholder="Yeni görev yaz">
<button onclick="addTask()">Görev Ekle</button>
<ul id="tasks"></ul>
</section>

<section>
<h2>ATLAS Sesli Rapor</h2>
<p id="message">Merhaba! Ben ATLAS. İşlerini takip etmeye hazırım.</p>
<button onclick="speak()">ATLAS Konuşsun</button>
<button class="secondary" onclick="resetData()">Verileri Sıfırla</button>
</section>

<script>
let data=JSON.parse(localStorage.getItem('atlas')||'{"sale":[],"expense":[],"tasks":[]}');

function save(){
 localStorage.setItem('atlas',JSON.stringify(data));
 render();
}
function add(type){
 let el=document.getElementById(type);
 let n=Number(el.value);
 if(!n||n<=0){alert('Geçerli bir tutar gir.');return;}
 data[type].push(n);
 el.value='';
 save();
}
function addTask(){
 let el=document.getElementById('task');
 if(!el.value.trim())return;
 data.tasks.push(el.value.trim());
 el.value='';
 save();
}
function render(){
 let s=data.sale.reduce((a,b)=>a+b,0);
 let e=data.expense.reduce((a,b)=>a+b,0);
 document.getElementById('sales').textContent=s.toLocaleString('tr-TR')+' TL';
 document.getElementById('expenses').textContent=e.toLocaleString('tr-TR')+' TL';
 document.getElementById('profit').textContent=(s-e).toLocaleString('tr-TR')+' TL';
 document.getElementById('count').textContent=data.sale.length;
 document.getElementById('tasks').innerHTML='';
 data.tasks.forEach((t,i)=>{
 let li=document.createElement('li');
 li.textContent=t+' ';
 let b=document.createElement('button');
 b.textContent='Tamamlandı / Sil';
 b.onclick=()=>{data.tasks.splice(i,1);save();};
 li.appendChild(b);
 document.getElementById('tasks').appendChild(li);
 });
}
function speak(){
 let s=data.sale.reduce((a,b)=>a+b,0);
 let e=data.expense.reduce((a,b)=>a+b,0);
 let msg='Merhaba. Ben ATLAS. Toplam ciron '+s+' Türk lirası. Toplam giderin '+e+' Türk lirası. Net kârın '+(s-e)+' Türk lirası.';
 document.getElementById('message').textContent=msg;
 if('speechSynthesis' in window){
 let u=new SpeechSynthesisUtterance(msg);
 u.lang='tr-TR';
 window.speechSynthesis.cancel();
 window.speechSynthesis.speak(u);
 }
}
function resetData(){
 if(confirm('Bütün kayıtlar silinsin mi?')){
 data={sale:[],expense:[],tasks:[]};
 save();
 }
}
render();
</script>
</body>
</html>
